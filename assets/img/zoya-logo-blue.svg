<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" role="img" aria-label="RYΘΛ Studio logo">
  <title>RYΘΛ Studio</title>

  <!-- Decorative top spike -->
  <line x1="50" y1="1" x2="50" y2="10" stroke="#0057ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="4.5" r="3.5" fill="#0057ff"/>

  <!-- 4 circular petals -->
  <circle cx="50" cy="32" r="24" fill="#0057ff"/>
  <circle cx="26" cy="62" r="24" fill="#0057ff"/>
  <circle cx="74" cy="62" r="24" fill="#0057ff"/>
  <circle cx="50" cy="92" r="24" fill="#0057ff"/>

  <!-- Letters centered in each petal -->
  <text x="50"  y="40"  text-anchor="middle" fill="white"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22">R</text>
  <text x="26"  y="70"  text-anchor="middle" fill="white"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22">Y</text>
  <text x="74"  y="70"  text-anchor="middle" fill="white"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22">Θ</text>
  <text x="50"  y="100" text-anchor="middle" fill="white"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22">Λ</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 95" role="img" aria-label="RYΘΛ Studio logo">
  <title>RYΘΛ Studio</title>

  <defs>
    <!-- Heart petal: bumps at top (y<0), point at bottom (y=16), centered at origin -->
    <path id="petal"
      d="M 0,16
         C -18,10 -19,-5 -10,-13
         C -5,-17 0,-11 0,-11
         C 0,-11 5,-17 10,-13
         C 19,-5 18,10 0,16 Z"/>
  </defs>

  <!-- Decorative crown: 3 rounded lobes + connecting stem -->
  <circle cx="50" cy="8"  r="5"   fill="white" stroke="#0057ff" stroke-width="1.8"/>
  <circle cx="43" cy="14" r="4.5" fill="white" stroke="#0057ff" stroke-width="1.8"/>
  <circle cx="57" cy="14" r="4.5" fill="white" stroke="#0057ff" stroke-width="1.8"/>
  <line x1="50" y1="22" x2="50" y2="25" stroke="#0057ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Top petal: R (center 50,42 — point at logo center 50,58) -->
  <use href="#petal" transform="translate(50,42)"
       fill="white" stroke="#0057ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="42" r="9" fill="none" stroke="#0057ff" stroke-width="1.2"/>
  <text x="50" y="42" text-anchor="middle" dominant-baseline="central"
        fill="#0057ff" font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="bold">R</text>

  <!-- Left petal: Y (center 34,58 — point at logo center 50,58) -->
  <use href="#petal" transform="translate(34,58) rotate(-90)"
       fill="white" stroke="#0057ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="34" cy="58" r="9" fill="none" stroke="#0057ff" stroke-width="1.2"/>
  <text x="34" y="58" text-anchor="middle" dominant-baseline="central"
        fill="#0057ff" font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="bold">Y</text>

  <!-- Right petal: Θ (center 66,58 — point at logo center 50,58) -->
  <use href="#petal" transform="translate(66,58) rotate(90)"
       fill="white" stroke="#0057ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="66" cy="58" r="9" fill="none" stroke="#0057ff" stroke-width="1.2"/>
  <text x="66" y="58" text-anchor="middle" dominant-baseline="central"
        fill="#0057ff" font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="bold">Θ</text>

  <!-- Bottom petal: Λ (center 50,74 — point at logo center 50,58) -->
  <use href="#petal" transform="translate(50,74) rotate(180)"
       fill="white" stroke="#0057ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="74" r="9" fill="none" stroke="#0057ff" stroke-width="1.2"/>
  <text x="50" y="74" text-anchor="middle" dominant-baseline="central"
        fill="#0057ff" font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="bold">Λ</text>
</svg>
